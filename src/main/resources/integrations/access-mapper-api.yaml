  /{municipalityId}/{namespace}/access/ad/{adId}:
    get:
      tags:
        - Access configuration
      operationId: getAccessDetails
      parameters:
        - name: municipalityId
          in: path
          description: Municipality ID
          required: true
          schema:
            type: string
          example: 2281
        - name: namespace
          in: path
          description: Namespace
          required: true
          schema:
            type: string
            pattern: "[\\w|\\-]+"
          example: MY_NAMESPACE
        - name: adId
          in: path
          description: AdId for the user to get details about
          required: true
          schema:
            type: string
          example: joe01doe
        - name: type
          in: query
          description: Filter type
          required: false
          schema:
            type: string
          example: label
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessGroup"
        "404":
